name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Coverage of metrics and render (at least 80 %)
        run: |
          go test -coverprofile=cover.out ./internal/metrics ./internal/render
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print int($3)}')
          echo "coverage: ${total}%"
          test "$total" -ge 80
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
